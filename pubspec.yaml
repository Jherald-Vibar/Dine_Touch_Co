name: dine_touch_kiosk
description: Dine Touch Co. - AI-Powered Restaurant Kiosk System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.0

  # Networking
  http: ^1.2.0

  # QR code
  qr_flutter: ^4.1.0

  # Supabase (real-time database)
  supabase_flutter: ^2.5.0

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0

  # Security (password hashing)
  crypto: ^3.0.3

  # Utilities
  intl: ^0.18.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/dine_touch_co.jpg